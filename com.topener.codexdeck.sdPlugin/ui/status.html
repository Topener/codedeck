<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Show">
			<sdpi-select setting="metric" default="activity">
				<option value="activity">Activity (needs input / working / idle)</option>
				<option value="usage-5h">Quota — short window</option>
				<option value="usage-weekly">Quota — long window</option>
				<option value="reset-5h">Time to reset — short window</option>
				<option value="reset-weekly">Time to reset — long window</option>
			</sdpi-select>
		</sdpi-item>
	</body>
</html>
